<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hold'em Lab</title>
  <meta name="description" content="No-limit Texas Hold'em trainer with adaptive human-like bots, a decision coach, hand review, stats and drills.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%99%A0%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="logo">♠</span> Hold'em Lab</div>
    <nav id="tabs" role="tablist" aria-label="Sections">
      <button role="tab" data-view="play" aria-selected="true">Play</button>
      <button role="tab" data-view="review">Review</button>
      <button role="tab" data-view="stats">Stats</button>
      <button role="tab" data-view="drills">Drills</button>
      <button role="tab" data-view="ranges">Ranges</button>
      <button role="tab" data-view="settings">Settings</button>
    </nav>
  </header>
  <main>
    <section id="view-play" class="view active" aria-label="Table">
      <div class="play-layout">
        <div class="table-col">
          <div class="meta-row">
            <span id="hand-meta" class="muted"></span>
            <span class="muted small keys">Keys: <kbd>F</kbd> fold · <kbd>C</kbd> check/call · <kbd>R</kbd> bet/raise · <kbd>H</kbd> hint · <kbd>Space</kbd> next hand</span>
          </div>
          <div id="table" class="table"></div>
          <div id="action-bar" class="action-bar"></div>
        </div>
        <aside id="sidebar" class="sidebar" aria-label="Training panel"></aside>
      </div>
    </section>
    <section id="view-review" class="view page" aria-label="Hand review"></section>
    <section id="view-stats" class="view page" aria-label="Statistics"></section>
    <section id="view-drills" class="view page" aria-label="Drills"></section>
    <section id="view-ranges" class="view page" aria-label="Ranges"></section>
    <section id="view-settings" class="view page" aria-label="Settings"></section>
  </main>
  <noscript>Hold'em Lab needs JavaScript.</noscript>
  <script type="module" src="js/main.js"></script>
</body>
</html>
